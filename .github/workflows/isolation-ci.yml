name: Isolation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: isolation-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolation:
    name: Testes de isolamento multi-tenant
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: admin_restaurant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d admin_restaurant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/admin_restaurant_test
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-at-least-32-chars-long!!
      COOKIE_SECRET: test-cookie-secret-change-me
      BASE_DOMAIN: localhost

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate

      - name: Unit tests (isolation)
        run: npm run test:unit

      - name: Full isolation suite (unit + integration)
        run: npm run test:isolation
