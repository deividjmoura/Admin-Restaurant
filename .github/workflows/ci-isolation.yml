# =============================================================================
# CI de isolamento multi-tenant
# skipped=0 · pass>0 · fail=0 · cancelled=0 → senão bloqueia merge
# =============================================================================
name: CI — Isolamento multi-tenant

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  isolation:
    name: isolamento (Node ${{ matrix.node }}, Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: admin_restaurant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d admin_restaurant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/admin_restaurant
      NODE_ENV: development
      BASE_DOMAIN: localhost
      JWT_SECRET: ci-only-not-a-real-secret-0000000000000000
      COOKIE_SECRET: ci-only-not-a-real-secret-0000000000000001
      APP_TIMEZONE: America/Sao_Paulo
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Aplica migrations
        run: npm run db:migrate

      - name: Roda testes de isolamento
        run: |
          npm run test:isolation 2>&1 | tee /tmp/test-isolation.log
          exit "${PIPESTATUS[0]}"

      - name: Verifica suite completa (skipped=0, cancelled=0, pass>0, fail=0)
        run: |
          echo "Resumo da suíte:"
          grep -E "^(# tests|# suites|# pass|# fail|# skipped|# cancelled)" /tmp/test-isolation.log || true

          SKIPPED=$(awk '/^# skipped/ {print $3; exit}' /tmp/test-isolation.log)
          PASSED=$(awk '/^# pass/ {print $3; exit}' /tmp/test-isolation.log)
          FAILED=$(awk '/^# fail/ {print $3; exit}' /tmp/test-isolation.log)
          CANCELLED=$(awk '/^# cancelled/ {print $3; exit}' /tmp/test-isolation.log)

          if [ -z "$SKIPPED" ] || [ "$SKIPPED" != "0" ]; then
            echo "::error::Esperado '# skipped 0' em CI — got skipped=${SKIPPED:-?}"
            tail -n 80 /tmp/test-isolation.log || true
            exit 1
          fi

          # Setup quebrado (ex. before() com erro) cancela testes — não pode passar silencioso
          if [ -z "$CANCELLED" ]; then
            CANCELLED=0
          fi
          if [ "$CANCELLED" != "0" ]; then
            echo "::error::Esperado '# cancelled 0' — got cancelled=${CANCELLED} (setup/hook provavelmente falhou)"
            tail -n 80 /tmp/test-isolation.log || true
            exit 1
          fi

          if [ -z "$PASSED" ] || [ "$PASSED" = "0" ]; then
            echo "::error::Esperado pelo menos 1 teste passando — got pass=${PASSED:-?}"
            tail -n 80 /tmp/test-isolation.log || true
            exit 1
          fi

          if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
            echo "::error::Há falhas na suíte — fail=${FAILED}"
            exit 1
          fi

          echo "✓ Suite ok: pass=${PASSED} skipped=0 cancelled=0 fail=0"

      - name: Smoke — /ready com DB
        run: |
          node --input-type=module <<'EOF'
          import { buildApp } from './src/app.js';
          const app = await buildApp({ logger: false });
          await app.ready();
          const res = await app.inject({ method: 'GET', url: '/ready' });
          console.log('/ready', res.statusCode, res.body);
          if (res.statusCode !== 200 || !res.json().db) {
            console.error('ready check failed');
            process.exit(1);
          }
          await app.close();
          console.log('✓ /ready ok');
          EOF

      - name: Upload log de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-isolation-log-node-${{ matrix.node }}
          path: /tmp/test-isolation.log
          retention-days: 7
