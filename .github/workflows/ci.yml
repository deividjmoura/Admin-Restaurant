name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · suíte de integração
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admin_restaurant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NODE_ENV: test
      # `node --test` NÃO lê .env: a variável precisa estar no ambiente do passo.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/admin_restaurant
      DATABASE_SSL: 'false'
      JWT_SECRET: ci-jwt-secret-0000000000000000000000000000
      COOKIE_SECRET: ci-cookie-secret-0000000000000000000000000000
      BASE_DOMAIN: localhost
      STAFF_SEED_PASSWORD: ci-seed-password
      MIN_TESTS: '29'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Dependências
        run: npm ci --no-audit --no-fund

      - name: Migrations
        run: npm run db:migrate

      - name: Seed (lojas demo/loja2, mesas, cardápio)
        run: npm run db:seed

      - name: Suíte completa (fail 0 E skipped 0)
        run: npm run test:suite
        env:
          SKIP_MIGRATE: '1'   # já aplicado no passo anterior

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
