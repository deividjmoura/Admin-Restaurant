name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on same ref (PR updates)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  isolation:
    name: isolation (unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admin_restaurant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/admin_restaurant_test
      DATABASE_SSL: "false"
      JWT_SECRET: test-jwt-secret-at-least-32-chars-long!!
      COOKIE_SECRET: test-cookie-secret-change-me
      BASE_DOMAIN: localhost
      NODE_ENV: test
      JWT_EXPIRES_IN: 7d
      APP_TIMEZONE: America/Sao_Paulo
      TABLE_SESSION_TTL_HOURS: 6
      CORS_ORIGIN: http://localhost:5173
      STAFF_SEED_PASSWORD: test-seed-password-123
      SUPER_ADMIN_EMAIL: admin@test.local
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres >/dev/null 2>&1; then
              echo "Postgres is ready"
              break
            fi
            echo "  attempt $i/30 — waiting..."
            sleep 1
          done
          pg_isready -h localhost -p 5432 -U postgres
          echo "Postgres ready"

      - name: Run migrations
        run: npm run db:migrate

      - name: Run lint (placeholder)
        run: npm run lint

      - name: Run unit tests (no DB required)
        run: npm run test:unit

      - name: Run isolation suite (integration requires DB)
        run: |
          echo "Running full isolation suite (unit + integration)..."
          # Enable globstar for ** patterns if needed (fallback uses *.test.js)
          shopt -s globstar || true
          echo "Test files:"
          ls -la test/isolation/*.test.js
          echo "Running: npm run test:isolation"
          npm run test:isolation 2>&1 | tee /tmp/test-isolation.log
          STATUS=${PIPESTATUS[0]}
          echo "--- test-isolation.log tail (200 lines) ---"
          tail -n 200 /tmp/test-isolation.log || true
          echo "--- summary ---"
          grep -E "^(# tests|# pass|# fail|# skipped|not ok|ok )" /tmp/test-isolation.log | tail -n 50 || true
          if [ $STATUS -ne 0 ]; then
            echo "::error::Isolation suite failed (exit $STATUS)"
            cat /tmp/test-isolation.log || true
            exit $STATUS
          fi

      - name: Upload isolation log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-isolation-log
          path: /tmp/test-isolation.log
          retention-days: 7

      - name: Verify integration tests were not skipped
        run: |
          echo "Checking that integration tests actually executed (not skipped due to missing DATABASE_URL)..."
          if grep -q "DATABASE_URL não definida" /tmp/test-isolation.log; then
            echo "::error::Integration tests were skipped — DATABASE_URL not set or DB unreachable. Suite must run fully in CI."
            exit 1
          fi
          # Optional: ensure we saw the key isolation suites
          if ! grep -q "repository isolation" /tmp/test-isolation.log; then
            echo "::warning::repository isolation suite output not found — check test names"
          fi
          if ! grep -q "HTTP tenant isolation" /tmp/test-isolation.log; then
            echo "::warning::HTTP tenant isolation suite output not found — check test names"
          fi
          # Fail if any test was reported as skipped when DB should be available
          SKIPPED=$(grep -c "# skip" /tmp/test-isolation.log || true)
          # grep -c returns count; if >0 we warn — but allow 0
          echo "Skipped count: $SKIPPED"
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::error::Found $SKIPPED skipped tests — integration should not skip in CI. Check DB connection."
            # Show skipped lines for debugging
            grep "# skip" /tmp/test-isolation.log || true
            exit 1
          fi
          echo "✓ No skipped tests — isolation fully executed"

      - name: Check /ready endpoint (smoke)
        run: |
          echo "Smoke: buildApp and /ready should work with migrated DB"
          node --input-type=module <<'EOF'
          import { buildApp } from './src/app.js';
          const app = await buildApp({ logger: false });
          await app.ready();
          const res = await app.inject({ method: 'GET', url: '/ready' });
          console.log('/ready', res.statusCode, res.body);
          if (res.statusCode !== 200) {
            console.error('ready check failed');
            process.exit(1);
          }
          const body = res.json();
          if (!body.db) {
            console.error('ready db false');
            process.exit(1);
          }
          await app.close();
          console.log('✓ /ready ok');
          EOF
